on:
  workflow_call:
    inputs:
      config-path:
        required: true
        type: string
      app: # The name of the app to clone into apps/, org/repo
        required: true
        type: string
      appDir:
        required: true
        type: string
      firebaseProject:
        default: 'dev'
        type: string
    secrets:
      envPAT:
        required: true
      HOTWAX_PUBLIC_SECRET:
        required: true
      VITE_FIREBASE_CONFIG:
        required: false
      VITE_FIREBASE_VAPID_KEY:
        required: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout accxui
        uses: actions/checkout@v4
        with:
          repository: hotwax/accxui
          path: .

      - name: Checkout app in apps/
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app }}
          path: apps/${{ inputs.appDir }} 
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Use Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Generate .env file
        run: cp .env.example .env
        working-directory: apps/${{ inputs.appDir }}

      - name: Set Firebase and VAPID Config
        run: |
          # Same quoting rule as the release workflow: the secret may be stored wrapped in quotes, and
          # public/firebase-messaging-sw.js is plain JS that needs an object literal. A quoted secret
          # reaching the worker verbatim makes firebaseConfig a STRING, initializeApp throws, the worker
          # fails to evaluate, and login dies with "messaging/failed-service-worker-registration".
          strip_quotes() {
            local v="$1"
            case "$v" in
              "'"*"'") v="${v#\'}"; v="${v%\'}" ;;
              '"'*'"') v="${v#\"}"; v="${v%\"}" ;;
            esac
            printf '%s' "$v"
          }
          VITE_FIREBASE_CONFIG="$(strip_quotes "${VITE_FIREBASE_CONFIG:-}")"
          VITE_FIREBASE_VAPID_KEY="$(strip_quotes "${VITE_FIREBASE_VAPID_KEY:-}")"

          if [[ -n "$VITE_FIREBASE_CONFIG" ]]; then
            sed -i "s|^VITE_FIREBASE_CONFIG=.*|VITE_FIREBASE_CONFIG=$VITE_FIREBASE_CONFIG|g" .env
            sed -i "s|^VITE_FIREBASE_VAPID_KEY=.*|VITE_FIREBASE_VAPID_KEY='$VITE_FIREBASE_VAPID_KEY'|g" .env
            sed -i "s|const firebaseConfig =.*|const firebaseConfig = $VITE_FIREBASE_CONFIG|g" public/firebase-messaging-sw.js

            # Fail the build rather than ship a worker that throws on evaluation.
            node -e '
              const fs = require("fs");
              const file = "public/firebase-messaging-sw.js";
              const line = (fs.readFileSync(file, "utf8").match(/const firebaseConfig = (.*)/) || [])[1];
              if (!line) { console.error(`${file}: firebaseConfig assignment not found`); process.exit(1); }
              const value = line.trim();
              if (value.startsWith("\"") || value.startsWith("'"'"'")) {
                console.error(`${file}: firebaseConfig is a quoted string, not an object literal.`);
                process.exit(1);
              }
            '
          fi
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        working-directory: apps/${{ inputs.appDir }}

      - name: Build
        run: pnpm --filter ${{ inputs.appDir }} build

      - name: Firebase Install and Deploy
        run: |
          npm install -g firebase-tools
          firebase use ${{ inputs.firebaseProject }} --token "$HOTWAX_PUBLIC_SECRET"
          firebase deploy --token "$HOTWAX_PUBLIC_SECRET" -m "Deploying via GitHub actions"  --only hosting:dev
        env:
            HOTWAX_PUBLIC_SECRET: ${{ secrets.HOTWAX_PUBLIC_SECRET }}
        working-directory: apps/${{ inputs.appDir }}