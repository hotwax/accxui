on:
  workflow_call:
    inputs:
      config-path:
        required: true
        type: string
      app: # The name of the app to clone into apps/, org/repo
        required: true
        type: string
      appDir:
        required: true
        type: string
      firebaseProject:
        default: 'default'
        type: string
      maxVersions:
        description: 'How many minor versions to keep live (latest patch of each minor, across all majors)'
        default: 1
        type: number
    secrets:
      envPAT:
        required: true
      HOTWAX_PUBLIC_SECRET:
        required: true
      VITE_FIREBASE_CONFIG:
        required: false
      VITE_FIREBASE_VAPID_KEY:
        required: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout accxui
        uses: actions/checkout@v4
        with:
          repository: hotwax/accxui
          path: .

      - name: Checkout app in apps/
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app }}
          path: apps/${{ inputs.appDir }}
          # Default branch (main) is checked out; full history + tags let us also build past releases.
          fetch-depth: 0
          fetch-tags: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Use Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'


      # Same selection as the release workflow: from all vMAJOR.MINOR.PATCH tags, keep the latest patch
      # of each MAJOR.MINOR, then keep the last maxVersions minor releases across all majors.
      # Unlike release (root = latest tag), here the root is built from main (see mainRef), so a merge
      # always publishes the freshly-merged code at root alongside those pinned releases.
      - name: Select versions to deploy
        id: versions
        working-directory: apps/${{ inputs.appDir }}
        env:
          MAX_VERSIONS: ${{ inputs.maxVersions }}
        run: |
          set -euo pipefail

          # Nothing has been checked out past the default branch yet, so HEAD is main.
          echo "mainRef=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          mapfile -t sorted < <(
            git tag -l |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V
          )

          # No releases yet is fine on merge: we still deploy main at root, just with no pinned versions.
          if [ ${#sorted[@]} -eq 0 ]; then
            echo "No release tags found; deploying main at root only."
            {
              echo "versions<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A latest_patch
          minor_order=()

          for tag in "${sorted[@]}"; do
            minor="${tag%.*}"

            if [ -z "${latest_patch[$minor]:-}" ]; then
              minor_order+=("$minor")
            fi

            latest_patch[$minor]=$tag
          done

          collapsed=()

          for minor in "${minor_order[@]}"; do
            collapsed+=("${latest_patch[$minor]}")
          done

          start=$(( ${#collapsed[@]} - MAX_VERSIONS ))

          if [ "$start" -lt 0 ]; then
            start=0
          fi

          selected=( "${collapsed[@]:$start}" )

          echo "Available releases:"
          printf '%s\n' "${collapsed[@]}"

          echo "Selected releases:"
          printf '%s\n' "${selected[@]}"

          {
            echo "versions<<EOF"
            printf "%s\n" "${selected[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      - name: Install Firebase CLI
        run: npm install -g firebase-tools


      - name: Build root (main) + selected versions
        working-directory: apps/${{ inputs.appDir }}
        env:
          VERSIONS: ${{ steps.versions.outputs.versions }}
          MAIN_REF: ${{ steps.versions.outputs.mainRef }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail

          # Always start clean so a stale version folder can't slip into the deploy.
          rm -rf dist
          mkdir -p dist

          # Strip one matching pair of surrounding quotes from a secret, so every consumer below gets
          # raw JSON: the .env line (dotenv would strip them, the service worker's plain JS would not,
          # and it needs an object literal rather than a quoted string).
          strip_quotes() {
            local v="$1"
            case "$v" in
              "'"*"'") v="${v#\'}"; v="${v%\'}" ;;
              '"'*'"') v="${v#\"}"; v="${v%\"}" ;;
            esac
            printf '%s' "$v"
          }
          VITE_FIREBASE_CONFIG="$(strip_quotes "${VITE_FIREBASE_CONFIG:-}")"
          VITE_FIREBASE_VAPID_KEY="$(strip_quotes "${VITE_FIREBASE_VAPID_KEY:-}")"

          prepare_env() {
            cp .env.example .env

            node -e '
              const fs = require("fs");
              const version = process.argv[1];
              let env = fs.readFileSync(".env", "utf8");
              env = env.replace(
                /^VITE_APP_VERSION_CONFIG=(.*)$/m,
                (_, json) => {
                  const config = JSON.parse(json);
                  config.buildVersion = version;
                  return "VITE_APP_VERSION_CONFIG=" + JSON.stringify(config);
                }
              );
              fs.writeFileSync(".env", env);
            ' "$1"

            if [ -n "${VITE_FIREBASE_CONFIG:-}" ]; then
              sed -i \
                "s|^VITE_FIREBASE_CONFIG=.*|VITE_FIREBASE_CONFIG=$VITE_FIREBASE_CONFIG|g" \
                .env
              sed -i \
                "s|^VITE_FIREBASE_VAPID_KEY=.*|VITE_FIREBASE_VAPID_KEY='$VITE_FIREBASE_VAPID_KEY'|g" \
                .env

              # The messaging service worker is plain JS in public/ — it can't read import.meta.env,
              # so its inlined config is patched here too. Only some apps ship one.
              if [ -f public/firebase-messaging-sw.js ]; then
                sed -i \
                  "s|const firebaseConfig =.*|const firebaseConfig = $VITE_FIREBASE_CONFIG|g" \
                  public/firebase-messaging-sw.js
              fi
            fi
          }

          build_at() {
            REF=$1
            VERSION=$2

            echo "Building $REF -> ${VERSION:-<root>}"

            git clean -fd
            git checkout --quiet -f "$REF"
            pnpm install
            prepare_env "$VERSION"

            # Build with the VITE_*-prefixed secrets out of the environment. Vite harvests every
            # VITE_*-prefixed process.env key and prioritizes it OVER .env (with no dotenv quote
            # stripping), which would override what prepare_env just wrote. Unsetting inside a
            # subshell keeps the values available for the remaining iterations of the loop.
            (
              unset VITE_FIREBASE_CONFIG VITE_FIREBASE_VAPID_KEY
              pnpm --filter ${{ inputs.appDir }} build
            )
          }

          # Root bootstrap from MAIN (empties dist/, writes dist/index.html) — must run first.
          build_at "$MAIN_REF" ""

          # Each selected release -> dist/vX.Y.Z/ (each build empties only its own subdir).
          while read -r version; do
            [ -z "$version" ] && continue
            build_at "$version" "$version"
          done <<< "$VERSIONS"

          echo "Generated dist:"
          find dist -maxdepth 1 -type d


      - name: Generate firebase.json rewrites
        working-directory: apps/${{ inputs.appDir }}
        env:
          VERSIONS: ${{ steps.versions.outputs.versions }}
          MAIN_REF: ${{ steps.versions.outputs.mainRef }}
        run: |
          set -euo pipefail

          # Base rewrites off main's firebase.json (root is main); catch-all -> the main bootstrap.
          git checkout --quiet "$MAIN_REF" -- firebase.json

          vs_json=$(
            printf '%s\n' "$VERSIONS" |
            grep -v '^$' |
            jq -R . |
            jq -s .
          )

          jq --argjson versions "$vs_json" '
            .hosting |= map(
              .rewrites =
                (
                  $versions |
                  map({
                    source: ("/" + . + "/**"),
                    destination: ("/" + . + "/index.html")
                  })
                )
                +
                [
                  {
                    source: "**",
                    destination: "/index.html"
                  }
                ]
            )
          ' firebase.json > firebase.json.tmp

          mv firebase.json.tmp firebase.json

          jq '.hosting[].rewrites' firebase.json


      - name: Firebase Deploy
        working-directory: apps/${{ inputs.appDir }}
        run: |
          firebase use ${{ inputs.firebaseProject }} --token "$HOTWAX_PUBLIC_SECRET"
          firebase deploy --token "$HOTWAX_PUBLIC_SECRET" -m "Deploying via GitHub actions" --only hosting:dev
        env:
          HOTWAX_PUBLIC_SECRET: ${{ secrets.HOTWAX_PUBLIC_SECRET }}
