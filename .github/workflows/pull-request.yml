name: Verify build

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ["fulfillment", "bopis", "receiving", "job-manager", "order-routing", "inventory-count", "transfers", "company", "order-manager", "products"]

    steps:
    - name: Checkout accxui
      uses: actions/checkout@v4
      with:
        repository: hotwax/accxui
        path: .

    - name: Checkout ${{ matrix.app }} in apps/
      uses: actions/checkout@v4
      with:
        repository: hotwax/${{ matrix.app }}
        path: apps/${{ matrix.app }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
        run_install: false

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Generate .env file
      run: cp .env.example .env
      working-directory: apps/${{ matrix.app }}

    - name: Build
      run: pnpm --filter ${{ matrix.app }} build

  full-workspace-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Checkout all current workspace apps
      run: |
        for app in available-to-promise bopis company facilities fulfillment inventory-count job-manager launchpad order-manager order-routing preorder products receiving reroute-fulfilment shopify-bopis transfers users; do
          git clone --depth 1 --branch main "https://github.com/hotwax/$app.git" "apps/$app"
        done
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'
    - name: Verify full frozen installation
      run: pnpm install --frozen-lockfile
