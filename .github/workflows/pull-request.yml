name: Verify build

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]

jobs:
  hosting-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: node --test scripts/hosting/*.test.mjs

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ["fulfillment", "bopis", "receiving", "job-manager", "order-routing", "inventory-count", "transfers", "company", "order-manager", "products"]

    steps:
    - name: Checkout accxui
      uses: actions/checkout@v4
      with:
        repository: hotwax/accxui
        path: .

    - name: Checkout ${{ matrix.app }} in apps/
      uses: actions/checkout@v4
      with:
        repository: hotwax/${{ matrix.app }}
        path: apps/${{ matrix.app }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
        run_install: false

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install

    - name: Generate .env file
      run: cp .env.example .env
      working-directory: apps/${{ matrix.app }}

    - name: Build
      run: pnpm --filter ${{ matrix.app }} build

    - name: Validate hosting compatibility output
      run: node scripts/hosting/prepare.mjs "apps/${{ matrix.app }}"
