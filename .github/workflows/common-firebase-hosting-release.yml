on:
  workflow_call:
    inputs:
      config-path:
        required: true
        type: string
      app: # The name of the app to clone into apps/, org/repo
        required: true
        type: string
      appDir:
        required: true
        type: string
      firebaseProject:
        default: 'uat'
        type: string
      accxuiVersion:
        description: 'Tag/version of accxui to build against'
        default: 'main'
        type: string
      retainedRefs:
        description: JSON array of additional app refs to retain; empty uses automatic stable-release retention
        default: ""
        type: string
      maxVersions:
        description: 'How many releases to keep live (latest patch of each MAJOR.MINOR, newest first)'
        default: 2
        type: number
    secrets:
      envPAT:
        required: true
      HOTWAX_PUBLIC_SECRET:
        required: true
      VITE_FIREBASE_CONFIG:
        required: false
      VITE_FIREBASE_VAPID_KEY:
        required: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout accxui
        uses: actions/checkout@v4
        with:
          repository: hotwax/accxui
          path: .
          ref: ${{ inputs.accxuiVersion }}
          fetch-depth: 0 # full history + tags: each release is built against the accxui it declares
          fetch-tags: true

      - name: Checkout app in apps/
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app }}
          path: apps/${{ inputs.appDir }}
          fetch-depth: 0 # full history + tags: every release is built from its own tag
          fetch-tags: true

      # Deployment compatibility must also work when app tags pin an older framework.
      # Keep these tools outside the framework files changed by use_accxui below.
      - name: Checkout current hosting compatibility tools
        uses: actions/checkout@v4
        with:
          repository: hotwax/accxui
          ref: main
          path: .hosting-tools
          sparse-checkout: scripts/hosting

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Use Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Build multi-version tree
        working-directory: apps/${{ inputs.appDir }}
        env:
          MAX_VERSIONS: ${{ inputs.maxVersions }}
          ROOT_REF: ${{ github.ref }}
          RETAINED_REFS: ${{ inputs.retainedRefs }}
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail

          prepare_env() {
            cp .env.example .env
            if [ -n "$VITE_FIREBASE_CONFIG" ]; then
              sed -i "s|^VITE_FIREBASE_CONFIG=.*|VITE_FIREBASE_CONFIG=$VITE_FIREBASE_CONFIG|g" .env
              sed -i "s|^VITE_FIREBASE_VAPID_KEY=.*|VITE_FIREBASE_VAPID_KEY='$VITE_FIREBASE_VAPID_KEY'|g" .env
              # public/ is plain JS and cannot read import.meta.env, so patch its inlined config too.
              if [ -f public/firebase-messaging-sw.js ]; then
                sed -i "s|const firebaseConfig =.*|const firebaseConfig = $VITE_FIREBASE_CONFIG|g" public/firebase-messaging-sw.js
              fi
            fi
          }

          # $1 = buildVersion ("" = root bootstrap, "vX.Y.Z" = that version).
          build() {
            prepare_env

            # The version config is forced through the build environment rather than edited into .env:
            # Vite gives VITE_*-prefixed process.env precedence over .env, so this is authoritative and
            # cannot silently miss the way an in-place regex edit can. buildVersion drives base/outDir;
            # environmentTypeId is always UAT here. appId is taken from the release's own .env.example,
            # which pre-migration tags lack — those just build unversioned at root.
            local cfg=""
            if grep -q '^VITE_APP_VERSION_CONFIG=' .env; then
              cfg=$(grep '^VITE_APP_VERSION_CONFIG=' .env | cut -d'=' -f2- |
                    jq -c --arg v "$1" '.buildVersion = $v | .environmentTypeId = "AppEnvUAT"')
              echo "building ${1:-root} with VITE_APP_VERSION_CONFIG=$cfg"
            fi

            # VITE_FIREBASE_* must NOT leak in the same way — .env holds the quote-stripped values.
            ( unset VITE_FIREBASE_CONFIG VITE_FIREBASE_VAPID_KEY
              if [ -n "$cfg" ]; then export VITE_APP_VERSION_CONFIG="$cfg"; fi
              pnpm --filter ${{ inputs.appDir }} build )

            [ -f "dist/${1:+$1/}index.html" ] || { echo "::error::${1:-root} built to the wrong path"; exit 1; }
            # A 200 response can hide an SPA fallback. Require version-prefixed built assets.
            if [ -n "$1" ]; then
              grep -Fq "src=\"/$1/assets/" "dist/$1/index.html" || { echo "::error::$1 has unversioned assets"; exit 1; }
            fi
          }

          # Every release was cut against one accxui version, named in that tag's own caller workflow: the
          # lockfile it was resolved with lives there, and its imports expect that common/. Pointing all
          # releases at the newest accxui gives an old release code it never shipped with, and a lockfile
          # that cannot satisfy its manifest — pnpm defaults --frozen-lockfile to true in CI, so the
          # install fails outright on any dependency the release has since added, dropped, or moved to
          # catalog:. accxui gitignores apps/, so re-pointing its ref leaves the app checkout untouched.
          # Tags predating the input keep inputs.accxuiVersion.
          default_accxui="${{ inputs.accxuiVersion }}"
          accxui="$default_accxui"
          use_accxui() {
            local want
            want=$(grep -rhoE 'accxuiVersion:[[:space:]]*[^[:space:]]+' .github/workflows 2>/dev/null |
                   head -1 | awk '{print $2}' | tr -d "\"'") || true
            want="${want:-$default_accxui}"
            if [ "$want" != "$accxui" ]; then
              echo "accxui $accxui -> $want (declared by $1)"
              git -C "$GITHUB_WORKSPACE" checkout --quiet -f "$want" ||
                { echo "::error::$1 declares accxui $want, which does not exist"; exit 1; }
              accxui="$want"
            fi
          }

          checkout() { git clean -fd; git checkout --quiet -f "$1"; use_accxui "$1"; pnpm install; }

          # Resolve every ref before checkout, and always include the triggering candidate. Explicit
          # retention lets an operator keep a known-good version without rebuilding a broken tag.
          resolve_ref() { git rev-parse --verify "$1^{commit}" 2>/dev/null || git rev-parse --verify "origin/$1^{commit}"; }
          root_commit=$(resolve_ref "$ROOT_REF")
          refs=()
          if [ -n "$RETAINED_REFS" ]; then
            jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' <<< "$RETAINED_REFS" >/dev/null
            mapfile -t refs < <(jq -r '.[]' <<< "$RETAINED_REFS")
          else
            mapfile -t refs < <(
              git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V |
              awk -F'[.]' '{m=$1"."$2; if(!(m in l)){o[++n]=m} l[m]=$0} END{for(i=1;i<=n;i++)print l[o[i]]}' |
              tail -n "$MAX_VERSIONS"
            )
          fi
          refs=("$root_commit" "${refs[@]}")
          versions=()
          commits=()
          for ref in "${refs[@]}"; do
            commit=$(resolve_ref "$ref")
            version="v$(git show "$commit:package.json" | jq -r .version)"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid package version at $ref"; exit 1; }
            if ! git show "$commit:.env.example" | grep -q '^VITE_APP_VERSION_CONFIG='; then
              if [ -z "$RETAINED_REFS" ] && [ "$commit" != "$root_commit" ]; then
                echo "::warning::$ref predates multi-version support; skipping /$version/"
                continue
              fi
              echo "::error::$ref lacks multi-version configuration"; exit 1
            fi
            duplicate=false
            for i in "${!versions[@]}"; do
              if [ "${versions[$i]}" = "$version" ]; then
                [ "${commits[$i]}" = "$commit" ] || { echo "::error::two different commits claim $version"; exit 1; }
                duplicate=true
              fi
            done
            if [ "$duplicate" = false ]; then versions+=("$version"); commits+=("$commit"); fi
          done
          root_version=${versions[0]}
          echo "root=$root_version versions=${versions[*]}"

          # Root first, because its build empties dist/. Every version uses its own framework pin.
          rm -rf dist
          checkout "$root_commit"
          build ""
          records=$(mktemp)
          for i in "${!versions[@]}"; do
            v=${versions[$i]}
            checkout "${commits[$i]}"
            build "$v"
            jq -n --arg version "$v" --arg appRevision "${commits[$i]}" \
              --arg accxuiRevision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
              '{version:$version,appRevision:$appRevision,accxuiRevision:$accxuiRevision,environmentTypeId:"AppEnvUAT"}' > "dist/$v/version.json"
            jq -c . "dist/$v/version.json" >> "$records"
          done
          [ -f dist/index.html ] || { echo "::error::root bootstrap was overwritten"; exit 1; }
          cp "dist/$root_version/version.json" dist/version.json
          app_id=$(git show "$root_commit:.env.example" | grep '^VITE_APP_VERSION_CONFIG=' | cut -d= -f2- | jq -r .appId)
          jq -s --arg appId "$app_id" --arg rootVersion "$root_version" \
            '{schemaVersion:1,appId:$appId,environmentTypeId:"AppEnvUAT",rootVersion:$rootVersion,versions:.}' "$records" > dist/hosted-versions.json
          rm "$records"

          git checkout --quiet "$root_commit" -- firebase.json .firebaserc
          rewrites=$(printf '%s\n' "${versions[@]}" | jq -R . | jq -s \
            'map({source:("/"+.+"/**"), destination:("/"+.+"/index.html")}) + [{source:"**",destination:"/index.html"}]')
          jq --argjson r "$rewrites" '.hosting |= map(.rewrites = $r | .headers = ((.headers // []) + [
            {source:"**",headers:[{key:"Cache-Control",value:"no-cache"}]},
            {source:"**/assets/**",headers:[{key:"Cache-Control",value:"public,max-age=31536000,immutable"}]},
            {source:"/hosted-versions.json",headers:[{key:"Cache-Control",value:"no-store"},{key:"Access-Control-Allow-Origin",value:"*"}]},
            {source:"**/version.json",headers:[{key:"Cache-Control",value:"no-store"}]}
          ]))' firebase.json > fb.tmp && mv fb.tmp firebase.json
          echo "DEPLOY_MSG=Root $root_version + versions ${versions[*]}" >> "$GITHUB_ENV"

      - name: Prepare legacy service-worker recovery
        run: node .hosting-tools/scripts/hosting/prepare.mjs "apps/${{ inputs.appDir }}"

      - name: Deploy to Firebase
        working-directory: apps/${{ inputs.appDir }}
        env:
          HOTWAX_PUBLIC_SECRET: ${{ secrets.HOTWAX_PUBLIC_SECRET }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          firebase use ${{ inputs.firebaseProject }} --token "$HOTWAX_PUBLIC_SECRET"
          firebase deploy --token "$HOTWAX_PUBLIC_SECRET" -m "$DEPLOY_MSG" --only hosting:uat

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: "Fetch release tag"
        run: |
          echo "LABEL=$(git describe --tags `git rev-list --tags --max-count=1`)" >> $GITHUB_ENV

      - name: "Create label"
        run: gh label create "release-${{ env.LABEL }}" --color FF7F7E
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
